name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
jobs:
  scope:
    uses: Oddmash/.github/.github/workflows/ci-scope.yml@5ef0314056be10f868b9bf889b879e6d322beb1e
    with:
      profile: ui
  browser-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      browser: ${{ steps.classify.outputs.browser }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: node --test scripts/ci-browser-scope.test.mjs scripts/ci-playwright-version.test.mjs
      - id: classify
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/ci-browser-scope.mjs
      - id: playwright
        run: node scripts/ci-playwright-version.mjs
  quality:
    needs: [scope, browser-scope]
    if: needs.scope.outputs.runtime == 'true' || needs.browser-scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: ${{ fromJSON((needs.scope.outputs.react18 == 'true' || needs.browser-scope.outputs.full == 'true') && '[18,19]' || '[19]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Use a shared store for compatibility checkouts
        run: echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/oddmash-ui-pnpm-store" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/compatibility/react18/pnpm-lock.yaml
      - name: Select isolated compatibility checkout
        shell: bash
        run: |
          check_dir="$GITHUB_WORKSPACE"
          if [ "${{ matrix.react }}" = "18" ]; then
            check_dir="$RUNNER_TEMP/oddmash-ui-react18"
            mkdir -p "$check_dir"
            git -c safe.directory="$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$check_dir"
            node scripts/prepare-react18.mjs "$check_dir"
            cp "$check_dir/tests/compatibility/react18/pnpm-lock.yaml" "$check_dir/pnpm-lock.yaml"
          fi
          test "$(pnpm store path --silent)" = "$(cd "$check_dir" && pnpm store path --silent)"
          echo "CHECK_DIR=$check_dir" >> "$GITHUB_ENV"
      - name: Record prepared dependency inputs
        working-directory: ${{ env.CHECK_DIR }}
        run: sha256sum package.json pnpm-lock.yaml pnpm-workspace.yaml tests/compatibility/react18/pnpm-lock.yaml > "$RUNNER_TEMP/oddmash-ui-dependency-inputs.sha256"
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: ${{ env.CHECK_DIR }}
      - if: matrix.react == 19
        run: pnpm run tokens:check
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm run build
        working-directory: ${{ env.CHECK_DIR }}
      - if: matrix.react == 19
        run: pnpm run test:bundle
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm run typecheck
        working-directory: ${{ env.CHECK_DIR }}
      - if: matrix.react == 19
        run: pnpm run lint
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm test
        working-directory: ${{ env.CHECK_DIR }}
      - name: Confirm prepared dependency inputs remain unchanged
        working-directory: ${{ env.CHECK_DIR }}
        run: sha256sum --check "$RUNNER_TEMP/oddmash-ui-dependency-inputs.sha256"
      - name: Confirm tracked dependency inputs remain unchanged
        run: git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml tests/compatibility/react18/pnpm-lock.yaml
  browser:
    needs: [scope, browser-scope]
    if: (needs.scope.outputs.runtime == 'true' || needs.browser-scope.outputs.full == 'true') && needs.browser-scope.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.browser-scope.outputs.playwright }}-noble
      options: --shm-size=1g
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: ${{ fromJSON((needs.scope.outputs.react18 == 'true' || needs.browser-scope.outputs.full == 'true') && '[18,19]' || '[19]') }}
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Use a shared store for compatibility checkouts
        run: echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/oddmash-ui-pnpm-store" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/compatibility/react18/pnpm-lock.yaml
      - name: Select isolated compatibility checkout
        shell: bash
        run: |
          check_dir="$GITHUB_WORKSPACE"
          if [ "${{ matrix.react }}" = "18" ]; then
            check_dir="$RUNNER_TEMP/oddmash-ui-react18"
            mkdir -p "$check_dir"
            git -c safe.directory="$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$check_dir"
            node scripts/prepare-react18.mjs "$check_dir"
            cp "$check_dir/tests/compatibility/react18/pnpm-lock.yaml" "$check_dir/pnpm-lock.yaml"
          fi
          test "$(pnpm store path --silent)" = "$(cd "$check_dir" && pnpm store path --silent)"
          echo "CHECK_DIR=$check_dir" >> "$GITHUB_ENV"
      - name: Record prepared dependency inputs
        working-directory: ${{ env.CHECK_DIR }}
        run: sha256sum package.json pnpm-lock.yaml pnpm-workspace.yaml tests/compatibility/react18/pnpm-lock.yaml > "$RUNNER_TEMP/oddmash-ui-dependency-inputs.sha256"
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm run build
        working-directory: ${{ env.CHECK_DIR }}
      - name: Run browser tests
        working-directory: ${{ env.CHECK_DIR }}
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          if [ "$BROWSER" = firefox ]; then
            container_home_owner=$(stat -c '%u:%g' /github/home)
            chown "$(id -u):$(id -g)" /github/home
            trap 'chown "$container_home_owner" /github/home' EXIT
          fi
          pnpm run test:browser --project="$BROWSER" --fully-parallel --update-snapshots=none
      - name: Capture exact Select visual failures for PR 44
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.number == 44 && github.event.pull_request.head.repo.full_name == github.repository && matrix.react == 19 && matrix.browser == 'chromium' }}
        working-directory: ${{ env.CHECK_DIR }}
        shell: bash
        run: |
          for theme in light dark; do
            file="test-results/visual-${theme}-screenshot-baselines-for-focus-and-overlays-chromium/select-${theme}-actual.png"
            if [ -f "$file" ]; then
              test "$(stat -c '%s' "$file")" -le 1048576
              echo "SELECT_SNAPSHOT_BEGIN:${theme}"
              base64 -w 1000 "$file" | sed 's/^/SELECT_SNAPSHOT_DATA:/'
              echo "SELECT_SNAPSHOT_END:${theme}"
            fi
          done
      - name: Confirm prepared dependency inputs remain unchanged
        working-directory: ${{ env.CHECK_DIR }}
        run: sha256sum --check "$RUNNER_TEMP/oddmash-ui-dependency-inputs.sha256"
      - name: Confirm tracked dependency inputs remain unchanged
        run: git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml tests/compatibility/react18/pnpm-lock.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-react-${{ matrix.react }}-${{ matrix.browser }}
          path: ${{ env.CHECK_DIR }}/test-results/

  verify:
    needs: [scope, browser-scope, quality, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm appropriate checks passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BROWSER_SCOPE_RESULT: ${{ needs.browser-scope.result }}
          RUN_QUALITY: ${{ needs.scope.outputs.runtime == 'true' || needs.browser-scope.outputs.full == 'true' }}
          RUN_BROWSER: ${{ (needs.scope.outputs.runtime == 'true' || needs.browser-scope.outputs.full == 'true') && needs.browser-scope.outputs.browser == 'true' }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -e
          test "$SCOPE_RESULT" = success
          test "$BROWSER_SCOPE_RESULT" = success
          verify() { case "$1:$2" in true:success|false:skipped) return 0 ;; *) return 1 ;; esac; }
          verify "$RUN_QUALITY" "$QUALITY_RESULT"
          verify "$RUN_BROWSER" "$BROWSER_RESULT"
