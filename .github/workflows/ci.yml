name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run tokens:check
      - if: matrix.react == 18
        run: npm install --no-save --ignore-scripts react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: npm run build
      - run: npm run test:bundle
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser -- --update-snapshots=none
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results-react-${{ matrix.react }}
          path: test-results/
