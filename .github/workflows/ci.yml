name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run tokens:check
      - run: npm install --no-save --package-lock=false --ignore-scripts react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: npm run build
      - run: npm run test:bundle
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser -- --update-snapshots=missing
      - uses: actions/upload-artifact@v4
        if: always() && matrix.react == 19
        with:
          name: visual-baselines
          path: tests/browser/visual.spec.ts-snapshots/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results-react-${{ matrix.react }}
          path: test-results/
