name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scope:
    uses: Oddmash/.github/.github/workflows/ci-scope.yml@5ef0314056be10f868b9bf889b879e6d322beb1e
    with:
      profile: ui
  quality:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        react: ${{ fromJSON(needs.scope.outputs.react18 == 'true' && '[18,19]' || '[19]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tests/compatibility/react18/pnpm-lock.yaml
      - name: Select isolated compatibility checkout
        run: |
          check_dir="$GITHUB_WORKSPACE"
          if [ "${{ matrix.react }}" = "18" ]; then
            check_dir="$RUNNER_TEMP/oddmash-ui-react18"
            mkdir -p "$check_dir"
            git archive HEAD | tar -x -C "$check_dir"
            node scripts/prepare-react18.mjs "$check_dir"
            cp "$check_dir/tests/compatibility/react18/pnpm-lock.yaml" "$check_dir/pnpm-lock.yaml"
          fi
          echo "CHECK_DIR=$check_dir" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm run tokens:check
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm run build
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm run test:bundle
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm run typecheck
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm run lint
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm test
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm run build:demo
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        working-directory: ${{ env.CHECK_DIR }}
      - run: pnpm run test:browser --update-snapshots=none
        working-directory: ${{ env.CHECK_DIR }}
      - name: Confirm tracked dependency inputs remain unchanged
        run: git diff --exit-code -- package.json pnpm-lock.yaml tests/compatibility/react18/pnpm-lock.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-react-${{ matrix.react }}
          path: ${{ env.CHECK_DIR }}/test-results/

  verify:
    needs: [scope, quality]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm appropriate checks passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_0: ${{ needs.scope.outputs.runtime }}
          RESULT_0: ${{ needs.quality.result }}
        run: |
          test "$SCOPE_RESULT" = success
          verify() { case "$1:$2" in true:success|false:skipped) return 0 ;; *) return 1 ;; esac; }
          verify "$RUN_0" "$RESULT_0"
