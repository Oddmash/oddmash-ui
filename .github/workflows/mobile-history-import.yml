name: One-time Mobile history import
on:
  push:
    branches: [chore/mobile-history-import-runner]
    paths: [.github/workflows/mobile-history-import.yml]
permissions:
  contents: write
concurrency:
  group: mobile-history-import
  cancel-in-progress: false
jobs:
  workspace:
    if: github.repository == 'Oddmash/oddmash-ui' && github.ref == 'refs/heads/chore/mobile-history-import-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refactor/mobile-workspace-import
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Configure isolated package workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2fd40f73910b4f0c6075d9bfb4222cbbf159b9d1
          git merge-base --is-ancestor a453709b53f579746dd2d0b6b4b01d61236adf82 HEAD
          git merge-base --is-ancestor a13ea7ac080baa9a2aec88234dcb8ac152715a02 HEAD
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const workspace = readFileSync('pnpm-workspace.yaml', 'utf8');
          writeFileSync('pnpm-workspace.yaml', "packages:\n  - '.'\n  - 'packages/mobile'\nsharedWorkspaceLockfile: false\nminimumReleaseAgeExclude:\n  - '@oddmash/*'\n" + workspace);
          const path = 'packages/mobile/package.json';
          const manifest = JSON.parse(readFileSync(path, 'utf8'));
          manifest.repository = { type: 'git', url: 'https://github.com/Oddmash/oddmash-ui.git', directory: 'packages/mobile' };
          manifest.devDependencies['@oddmash/ui'] = 'workspace:*';
          writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          const eslint = readFileSync('eslint.config.js', 'utf8');
          writeFileSync('eslint.config.js', eslint.replace("'src/generated/**'", "'src/generated/**', 'packages/mobile/**'"));
          NODE
          git rm packages/mobile/pnpm-workspace.yaml
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
          pnpm --filter @oddmash/mobile-interactions run verify
          pnpm --filter @oddmash/mobile-interactions pack --pack-destination "$RUNNER_TEMP"
          pnpm run typecheck
          pnpm run lint
          pnpm test
      - name: Push verified workspace changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'qtaghdi'
          git config user.email '135234546+qtaghdi@users.noreply.github.com'
          git add -- pnpm-workspace.yaml pnpm-lock.yaml eslint.config.js packages/mobile/package.json packages/mobile/pnpm-lock.yaml packages/mobile/pnpm-workspace.yaml
          git diff --cached --stat
          git commit -m "refactor: configure Mobile as an independent workspace package"
          git push origin HEAD:refs/heads/refactor/mobile-workspace-import
