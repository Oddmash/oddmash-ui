name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease)')" = false
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e '
            import fs from "node:fs";
            const {name, version} = JSON.parse(fs.readFileSync("package.json"));
            if (name !== "@oddmash/ui" || !/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== "v" + version) {
              throw Error("The release tag must match the stable @oddmash/ui package version");
            }
          '
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - run: pnpm run check
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
      - name: Verify historical npm-lockfile release retry
        if: ${{ hashFiles('pnpm-lock.yaml') == '' && hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts && npm run check
      - run: test -f pnpm-lock.yaml || test -f package-lock.json
      - run: npm pack --ignore-scripts --pack-destination /tmp
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: /tmp/oddmash-ui-*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - run: npm publish ./package/oddmash-ui-*.tgz --access public --ignore-scripts
