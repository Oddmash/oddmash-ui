name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e '
            import fs from "node:fs";
            const {name, version} = JSON.parse(fs.readFileSync("package.json"));
            if (name !== "@oddmash/ui" || !/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== "v" + version) {
              throw Error("The release tag must match the stable @oddmash/ui package version");
            }
          '
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --ignore-scripts --pack-destination /tmp
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: /tmp/oddmash-ui-*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - run: npm publish package/oddmash-ui-*.tgz --access public --ignore-scripts
