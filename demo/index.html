<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A small, considered design system for developer tools. Explore live React components, JSON tokens, and practical usage guides."
    />
    <link rel="icon" type="image/png" href="./oddmash-logo.png" />
    <title>Oddmash UI — Design system</title>
    <script>
      try {
        const theme =
          localStorage.getItem('om-docs-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.omTheme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
